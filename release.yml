name: Build signed APK and publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; must equal v + app versionName
        required: true
        default: v0.1.2
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all 289 parent-manifest parameter fixtures
        run: python tools/validate_geometry.py
      - name: Validate release-integrity invariants
        run: python tools/validate_release.py
      - name: Verify requested tag matches Android versionName
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          EXPECTED="v${VERSION_NAME}"
          if [ "${{ inputs.tag }}" != "$EXPECTED" ]; then
            echo "Release tag ${{ inputs.tag }} does not match app versionName $VERSION_NAME (expected $EXPECTED)."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STOREPASS" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEYPASS" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE" | base64 --decode > app/release.keystore
      - name: Build signed release APK
        env:
          SMA_KEYSTORE_PATH: release.keystore
          SMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "stereo-multistability-android-${{ inputs.tag }}.apk"
          sha256sum "stereo-multistability-android-${{ inputs.tag }}.apk" > "stereo-multistability-android-${{ inputs.tag }}.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" --target "$GITHUB_SHA" --title "Stereo Multistability Android ${{ inputs.tag }}" --generate-notes
          gh release upload "${{ inputs.tag }}" "stereo-multistability-android-${{ inputs.tag }}.apk" "stereo-multistability-android-${{ inputs.tag }}.apk.sha256" --clobber
